<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Refined Rests | Home</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="home-page">
    <header class="navbar">
        <a href="home.html" class="logo">Refined Rests</a>
        <nav class="nav-links">
            <a href="home.html" class="active">Home</a>
            <a href="about.html">About</a>
        </nav>
    </header>
    <main class="restroom-layout">
        <aside class="restroom-sidebar">
            <h1>Find a restroom</h1>
        <label class="sr-only" for="sidebar-search">Search restrooms</label>
        <input
            id="sidebar-search"
            class="sidebar-search"
            type="search"
            placeholder="Search restrooms..."
        >
            <div id="restroom-list"></div>
        </aside>
<section class="map-panel" aria-label="Restroom map">
    <div class="map-search">
        <label class="sr-only" for="map-search">Search restrooms</label>
        <input
            id="map-search"
            type="search"
            placeholder="Search by building, address, or flair..."
        >
    </div>

    <div id="map" class="location-map"></div>
</section>
    </main>
    <script src="config.local.js"></script>
    <script src="js/home.js"></script>
</body>
</html>
