<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Refined Rests | Locate</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header class="navbar">

        <a href="home.html" class="logo">
            Refined Rests
        </a>

        <nav class="nav-links">

            <a href="home.html">Home</a>

            <a href="about.html">About</a>

            <a href="review.html">Review</a>

            <a href="locate.html" class="active">Locate</a>

        </nav>

    </header>

    <main class="locate-section">

        <h1>Refined Rests Reviewed Bathrooms</h1>

        <div id="map" class="location-map"></div>

    </main>

    <script src="config.local.js"></script>

    <script>
        function initMap() {
            const map = new google.maps.Map(document.getElementById("map"), {
                center: { lat: 39.71084367645474, lng: -75.12028505092695 },
                zoom: 17,
                mapId: "DEMO_MAP_ID"
            });

            const restroomMarker = new google.maps.marker.AdvancedMarkerElement({
                map: map,
                position: {
                    lat: 39.71084367645474,
                    lng: -75.12028505092695
                },
                title: "Robinson Hall restrooms"
            });

            const restroomInfo = new google.maps.InfoWindow({
                content: "<strong>Robinson Hall</strong><br>Restrooms on floors 1, 2, and 3."
            });

            restroomMarker.addListener("click", function () {
                restroomInfo.open({
                    map: map,
                    anchor: restroomMarker
                });
            });
        }

        const mapsScript = document.createElement("script");
        mapsScript.src =
            "https://maps.googleapis.com/maps/api/js?key=" +
            GOOGLE_MAPS_API_KEY +
            "&loading=async&libraries=marker&callback=initMap";
        mapsScript.async = true;
        document.head.appendChild(mapsScript);
    </script>

</body>

</html>
